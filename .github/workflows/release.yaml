name: Release

# Pushing a version tag is itself a deliberate manual action, so this workflow
# runs on tags without the AUTO_CI gate used by ci.yaml.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and release (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Release
        run: |
          xcodebuild \
            -project Silicon.xcodeproj \
            -scheme Silicon \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify arm64-only executable
        run: |
          EXECUTABLE="build/DerivedData/Build/Products/Release/Silicon.app/Contents/MacOS/Silicon"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Executable architectures: $ARCHS"
          test "$ARCHS" = "arm64"

      - name: Package app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Silicon.app"
          ZIP_NAME="Silicon-${GITHUB_REF_NAME}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Silicon ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
